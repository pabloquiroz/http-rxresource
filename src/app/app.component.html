<div class="p-6">
  <h1 class="text-2xl font-bold mb-4">Magic Cards</h1>

  @if(cards.isLoading()) {
    <div class="loading">Loading cards...</div>
  }

  @if(cards.error()) {
    <div class="error">Failed to load cards</div>
  }

  @if(cards.hasValue()) {
    <table class="table-container">
      <thead class="bg-gray-100">
        <tr>
          <th class="table-header">id</th>
          <th class="table-header">Name</th>
          <th class="table-header">Type</th>
          <th class="table-header">Set</th>
        </tr>
      </thead>
      <tbody>
        @for (card of cards.value().cards.slice(0, 10); track card.id) {
          <tr>
            <td class="table-cell">{{ card.id }}</td>
            <td class="table-cell">{{ card.name }}</td>
            <td class="table-cell">{{ card.type }}</td>
            <td class="table-cell">{{ card.setName }}</td>
          </tr>
        }
      </tbody>
    </table>
  }
</div>
